<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 200" width="820" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#1e2140"/>
      <stop offset="50%" stop-color="#171a30"/>
      <stop offset="100%" stop-color="#12152a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="820" height="200" rx="16" fill="url(#bg)"/>

  <!-- Keep Spike in a CJK monospace font so the terminal art retains its shape. -->
  <g font-family="'Noto Sans Mono CJK JP','MS Gothic','Yu Gothic',monospace" font-size="26" fill="#e8d5a8" xml:space="preserve">
    <text x="30" y="50">  ／\、</text>
    <text x="30" y="80">（ﾟ､ ｡ ７</text>
    <text x="30" y="110">  |  ~ヽ\</text>
    <text x="30" y="140">  じしε_,)ノ</text>
  </g>

  <!-- ============ TEXT ============ -->
  <text x="280" y="90" font-family="'Segoe UI',Arial,sans-serif" font-size="56" font-weight="bold" fill="#e8d5a8" letter-spacing="3">wslwatch</text>
  <text x="282" y="125" font-family="'Segoe UI',Arial,sans-serif" font-size="16" fill="#7a8da0" letter-spacing="1">keep your WSL distros awake</text>
</svg>
